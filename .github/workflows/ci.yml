name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select an available iPad simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for r in d for dev in d[r] if 'iPad' in dev['name']))")
          echo "Selected iPad simulator: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project GlobeDisplay.xcodeproj \
            -scheme GlobeDisplay \
            -destination "id=$SIM_UDID" \
            -only-testing:GlobeDisplayTests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild-test.log
